name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ndapp
          POSTGRES_PASSWORD: ndapp
          POSTGRES_DB: ndapp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ndapp -d ndapp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ndapp:ndapp@localhost:5432/ndapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Domain layer must not import UI, network, or persistence
        run: |
          if grep -R -n -E "from ['\"]react|from ['\"]react-native|from ['\"]@supabase|from ['\"]expo|from ['\"]pg|from ['\"]hono" src/domain; then
            echo "Domain code must stay independent of UI and persistence libraries"
            exit 1
          fi
      - run: npm test
      - run: npm run build
      - name: Vercel function must not import TypeScript source
        run: npm run check:vercel-function
      - name: Committed Vercel function must match the build
        run: git diff --exit-code -- api/index.js
      - name: Browser bundle must not contain privileged secrets
        run: |
          if grep -R -n -E "service_role|SUPABASE_SERVICE_ROLE|JWT_SECRET" dist; then
            echo "Privileged secrets must not appear in the browser bundle"
            exit 1
          fi

  hosted:
    name: Hosted Supabase contracts
    runs-on: ubuntu-latest
    if: ${{ vars.NDAPP_HOSTED_TESTS == '1' }}
    env:
      NDAPP_HOSTED_TESTS: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HOSTED_DATABASE_URL: ${{ secrets.HOSTED_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx vitest run src/persistence/hosted.test.ts
